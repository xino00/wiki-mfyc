services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: wiki, POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U wiki"], interval: 10s, timeout: 5s, retries: 5 }
  web:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { postgres_data: {} }
